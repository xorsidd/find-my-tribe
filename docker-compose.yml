version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://host.docker.internal:27017/findmytribe
      - GEMINI_API_KEY=${GEMINI_API_KEY:-YOUR_MOCK_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    image: python:3.10-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: python -m http.server 3000
    ports:
      - "3000:3000"

